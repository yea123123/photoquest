name: iOS Build

# Сборка приложения «Фото-квест» на macOS-раннере:
# 1) XcodeGen генерирует PhotoQuest.xcodeproj из project.yml
# 2) xcodebuild собирает и архивирует приложение (без подписи)
# 3) .xcarchive выкладывается как artifact

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Archive
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Модель MobileNetV2 не хранится в репозитории — скачиваем в CI.
      # Если ни один источник не сработал — сборка продолжится без модели
      # (приложение покажет экран «модель не найдена»).
      - name: Download MobileNetV2 model (best effort)
        run: |
          mkdir -p PhotoQuest/Models
          OUT="PhotoQuest/Models/MobileNetV2.mlmodel"
          rm -f "$OUT"
          for url in \
            "https://ml-assets.apple.com/coreml/models/Image/ImageClassification/MobileNetV2/MobileNetV2.mlmodel" \
            "https://raw.githubusercontent.com/tucan9389/ImageClassification-CoreML/master/ImageClassification-CoreML/mlmodel/MobileNet/MobileNetV2.mlmodel" \
            "https://docs-assets.developer.apple.com/coreml/models/MobileNetV2.mlmodel" \
            "https://raw.githubusercontent.com/hollance/MobileNet-CoreML/master/MobileNetV2.mlmodel" \
            "https://raw.githubusercontent.com/hollance/MobileNet-CoreML/main/MobileNetV2.mlmodel"; do
            echo "Trying $url"
            if curl -sSL --fail -o "$OUT" "$url"; then
              echo "Downloaded from $url"
              break
            fi
          done
          # Fallback: ищем модель внутри архива репозитория hollance
          if [ ! -s "$OUT" ]; then
            echo "Trying GitHub tarball of hollance/MobileNet-CoreML"
            if curl -sSL --fail -o /tmp/mobilenet-repo.tar.gz \
                 "https://github.com/hollance/MobileNet-CoreML/archive/refs/heads/master.tar.gz"; then
              FOUND=$(tar -tzf /tmp/mobilenet-repo.tar.gz | grep -i "MobileNetV2\.mlmodel$" | head -n 1)
              echo "Found in tarball: ${FOUND:-none}"
              if [ -n "$FOUND" ]; then
                tar -xzf /tmp/mobilenet-repo.tar.gz -C PhotoQuest/Models "$FOUND"
                find PhotoQuest/Models -name "MobileNetV2.mlmodel" -exec mv -f {} "$OUT" \;
              fi
            else
              echo "Tarball download failed"
            fi
          fi
          if [ -s "$OUT" ]; then
            size=$(stat -f%z "$OUT")
            if [ "$size" -lt 1000000 ] || ! unzip -t "$OUT" >/dev/null 2>&1; then
              echo "::warning::Файл модели выглядит битым (${size} байт) — собираю без модели"
              rm -f "$OUT"
            else
              echo "Модель загружена: ${size} байт"
            fi
          else
            echo "::warning::MobileNetV2.mlmodel не загружен — сборка продолжается без модели детекции"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, generic iOS device)
        run: |
          xcodebuild \
            -project PhotoQuest.xcodeproj \
            -scheme PhotoQuest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive
        run: |
          xcodebuild \
            -project PhotoQuest.xcodeproj \
            -scheme PhotoQuest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PhotoQuest.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      # Упаковываем unsigned .app из архива в IPA (zip с папкой Payload).
      # Sideloadly/AltStore на Windows сами подпишут его вашим Apple ID.
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/PhotoQuest.xcarchive/Products/Applications/PhotoQuest.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -qry ../PhotoQuest-unsigned.ipa Payload
          cd ..
          echo "IPA ready: $(stat -f%z PhotoQuest-unsigned.ipa) bytes"

      - name: Upload IPA (unsigned, for sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: PhotoQuest-unsigned-ipa
          path: PhotoQuest-unsigned.ipa
          if-no-files-found: error

      - name: Upload xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: PhotoQuest-xcarchive
          path: build/PhotoQuest.xcarchive
          if-no-files-found: error
